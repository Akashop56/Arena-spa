# JVM args for the Gradle daemon (kept modest for machines with limited RAM)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX is required for this project
android.useAndroidX=true

# Only keep the R class for the app module (faster builds)
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# No parallel builds: keeps memory usage predictable on small machines
org.gradle.parallel=false

# Cache build outputs across runs
org.gradle.caching=true
