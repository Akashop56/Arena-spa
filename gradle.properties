# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX is required for this project
android.useAndroidX=true

# Only keep the R class for the app module (faster builds)
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# Parallel builds
org.gradle.parallel=true

# Cache build outputs
org.gradle.caching=true

# Allow AGP to download required Android SDK platform tools
android.builder.sdk.download=true
